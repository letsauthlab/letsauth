name: Refresh screenshot baselines

# Screenshot baselines must come from the Chromium build that CI uses (Playwright pins it),
# otherwise font rasterisation differs by a few percent and the comparison fails. Add the
# `refresh-screenshots` label to a pull request after an intended visual change: this workflow
# regenerates the baselines under tests/e2e/__screenshots__ with CI's browser, commits them to
# the pull request branch and removes the label. Push any follow-up commit to re-run CI (a push
# made with the workflow token does not trigger it).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate and commit baselines
    if: github.event.label.name == 'refresh-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The same cache as ci.yml: the lockfile pins the Playwright version, and with it the
      # Chromium build the baselines must come from.
      - name: Restore Playwright browsers
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate baselines
        run: pnpm exec playwright test --update-snapshots --grep "looks right"
      - name: Commit baselines
        run: |
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh screenshot baselines from CI's Chromium" -m "Generated by the screenshots workflow for #${{ github.event.pull_request.number }}."
          git push
      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/refresh-screenshots" || true
