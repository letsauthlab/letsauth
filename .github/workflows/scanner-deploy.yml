name: Scanner deploy

# Builds the scanner image and deploys it to Scaleway (constitution VII): the image goes to the
# Scaleway Container Registry and the Serverless Job definition that runs the nightly scan is
# pointed at it. Runs after the CI workflow has passed on main (never on a red commit, like the
# site deploy) for the latest main snapshot, or by hand from main. The scan itself never runs on
# GitHub; see docs/scanner.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scanner-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build the image and update the Scaleway job
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SCW_REGION: ${{ vars.SCW_REGION || 'fr-par' }}
      IMAGE: rg.${{ vars.SCW_REGION || 'fr-par' }}.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/letsauth-scanner
      # deploy exactly the commit CI tested
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment of $EXPECTED_SHA; main is $current"
          fi
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - if: steps.current.outputs.deploy == 'true'
        name: Check the configuration
        env:
          NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE }}
          JOB: ${{ vars.SCW_JOB_DEFINITION_ID }}
          SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          : "${NAMESPACE:?set the repository variable SCW_REGISTRY_NAMESPACE}"
          : "${JOB:?set the repository variable SCW_JOB_DEFINITION_ID}"
          : "${SECRET_KEY:?set the repository secret SCW_SECRET_KEY}"
      - if: steps.current.outputs.deploy == 'true'
        name: Log in to the Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "rg.${SCW_REGION}.scw.cloud" -u nologin --password-stdin
      - if: steps.current.outputs.deploy == 'true'
        name: Build and push the image
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:${SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${SHA}"
          docker push "$IMAGE:latest"
      - if: steps.current.outputs.deploy == 'true'
        name: Point the Serverless Job at the new image
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          args: jobs definition update ${{ vars.SCW_JOB_DEFINITION_ID }} image-uri=${{ env.IMAGE }}:${{ env.SHA }} region=${{ env.SCW_REGION }}
