name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded pull request runs are cancelled. Runs on main never are: the scanner and site deploys
# follow each green CI run on main, and a cancelled (or queued-then-dropped) run skips its deploy,
# so on main every commit gets its own group.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  statuses: write # Lighthouse CI posts its scores as a commit status

jobs:
  check:
    name: Validate, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate data
        run: pnpm validate:data
      - name: Observations are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          pnpm check:append-only "origin/${{ github.base_ref }}"
      - name: Lint
        run: pnpm lint
      - name: Prose (warn only until WP9 of specs/016)
        run: pnpm check:prose
      - name: Colour contrast
        run: pnpm check:contrast
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Byte budgets
        run: pnpm check:budgets
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Lighthouse budgets
        run: pnpm exec lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
