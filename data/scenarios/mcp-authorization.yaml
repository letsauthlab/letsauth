id: mcp-authorization
title: An MCP client obtains a token for an MCP server
summary: >
  The baseline chain of MCP Authorization 2026-07-28: an agent host discovers where a tasks
  server's authorization server is, identifies itself with a client ID metadata document, runs
  the OAuth 2.1 code flow with PKCE and a resource indicator, and presents the token the
  server was issued for. The server validates it and uses a token of its own for the API behind
  it.
actors:
  - { id: user, kind: user, name: Alex }
  - { id: client, kind: mcp-client, name: Agent host }
  - { id: server, kind: mcp-server, name: Tasks MCP server }
  - { id: as, kind: authorization-server, name: auth.tasks.example }
  - { id: api, kind: resource, name: Tasks API }
features:
  - mcp.prm.www-authenticate
  - mcp.prm.well-known
  - mcp.prm.authorization-servers
  - mcp.as.metadata
  - mcp.as.cimd
  - mcp.client.pkce
  - mcp.as.pkce-s256
  - mcp.client.resource-param
  - mcp.as.resource-indicator
  - mcp.as.iss-param
  - mcp.client.iss-compare-no-normalization
  - mcp.rs.bearer-header
  - mcp.rs.audience-validation
  - mcp.rs.no-passthrough
steps:
  - id: unauthenticated-request
    from: client
    to: server
    message: "POST /mcp (initialize) with no Authorization header"
    note: >
      The host has no token for this server yet, so it starts with the request any client makes
      first. Everything it learns about where to get a token comes from the answer.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization Server Discovery › Protected Resource Metadata Discovery Requirements" }
  - id: challenge
    from: server
    to: client
    message: "401 with WWW-Authenticate: Bearer resource_metadata=\"…/.well-known/oauth-protected-resource/mcp\""
    note: >
      The server must point at its protected resource metadata, either in this challenge or at
      the well-known location. This server does both.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization Server Discovery › Protected Resource Metadata Discovery Requirements" }
  - id: fetch-prm
    from: client
    to: server
    message: "GET /.well-known/oauth-protected-resource/mcp"
    cites: { spec: rfc9728, revision: rfc, section: "3. Protected Resource Metadata" }
  - id: prm
    from: server
    to: client
    message: "resource: https://mcp.tasks.example/mcp, authorization_servers: [https://auth.tasks.example]"
    note: >
      The resource identifier is what the client will ask the token to be bound to. The
      authorization server list is where it will ask.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization Server Discovery › Authorization Server Location" }
  - id: fetch-as-metadata
    from: client
    to: as
    message: "GET /.well-known/oauth-authorization-server"
    cites: { spec: rfc8414, revision: rfc, section: "3. Obtaining Authorization Server Metadata" }
  - id: as-metadata
    from: as
    to: client
    message: "issuer, endpoints, code_challenge_methods_supported: [S256], client_id_metadata_document_supported: true"
    note: >
      The issuer must match the URL the client asked. The client keeps the metadata keyed by
      that issuer.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization Server Discovery › Authorization Server Metadata Discovery" }
  - id: authorization-request
    from: client
    to: as
    message: "Authorization request via Alex's browser: client_id=https://agent.example/client.json, code_challenge (S256), resource=https://mcp.tasks.example/mcp, state"
    note: >
      The client identifies itself with the URL of its metadata document instead of registering
      first. The resource parameter names the server the token is for.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Client Registration › Client ID Metadata Documents" }
  - id: consent
    from: as
    to: user
    message: "Consent screen built from the fetched client metadata: name, redirect URI, requested scope"
    note: >
      The authorization server fetches the document at the client_id URL, checks that the
      redirect URI is one it lists, and shows Alex who is asking.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Client Registration › Client ID Metadata Documents" }
  - id: authorization-response
    from: as
    to: client
    message: "Redirect with code, state and iss=https://auth.tasks.example"
    note: >
      The client compares iss byte for byte with the issuer it discovered before it uses the
      code. A mismatch means the response came from somewhere else.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization › Authorization Response Validation" }
  - id: token-request
    from: client
    to: as
    message: "POST /token: grant_type=authorization_code, code, code_verifier, resource=https://mcp.tasks.example/mcp"
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Authorization Code Protection" }
  - id: token-response
    from: as
    to: client
    message: "Access token bound to the tasks server"
    note: >
      The authorization server verified the code verifier against the challenge and issued a
      token whose audience is the resource the client asked for.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Token Audience Binding and Validation" }
    token:
      name: Access token for the Tasks MCP server
      header: { typ: at+jwt, alg: ES256, kid: auth-2026-1 }
      claims:
        iss: https://auth.tasks.example
        sub: alex
        aud: https://mcp.tasks.example/mcp
        client_id: https://agent.example/client.json
        scope: tasks:read tasks:write
        exp: 1790000000
        iat: 1789996400
        jti: 7f2c
      note: Shown in the RFC 9068 JWT profile. An opaque token would carry the same binding on the server side.
  - id: bearer-call
    from: client
    to: server
    message: "POST /mcp (tools/call) with Authorization: Bearer <access token>"
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization › Access Token Usage" }
    token:
      name: Access token as presented
      header: { typ: at+jwt, alg: ES256, kid: auth-2026-1 }
      claims:
        iss: https://auth.tasks.example
        sub: alex
        aud: https://mcp.tasks.example/mcp
        client_id: https://agent.example/client.json
        scope: tasks:read tasks:write
        exp: 1790000000
        iat: 1789996400
        jti: 7f2c
  - id: validate
    from: server
    to: server
    message: "Validate signature, iss, exp and that aud is this server; check scope"
    note: >
      A token issued for another resource is rejected here, whoever presents it. This is the
      check the resource parameter exists for.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Token Audience Binding and Validation" }
  - id: upstream-call
    from: server
    to: api
    message: "GET /tasks with a token the server obtained for the API (here by token exchange, acting for Alex)"
    note: >
      The server never forwards the token it received. It holds credentials of its own for the
      API and obtains a token whose audience is the API, so the API can tell who is calling on
      whose behalf.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Access Token Privilege Restriction" }
    token:
      name: The server's own token for the Tasks API
      header: { typ: at+jwt, alg: ES256, kid: auth-2026-1 }
      claims:
        iss: https://auth.tasks.example
        sub: alex
        aud: https://api.tasks.example
        client_id: tasks-mcp-server
        scope: tasks:read
        act: { sub: tasks-mcp-server }
        exp: 1789999000
        iat: 1789996500
        jti: 9b10
  - id: result
    from: server
    to: client
    message: "200 with the tool result"
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization › Access Token Usage" }
toggles:
  - id: token-passthrough
    name: Token passthrough
    kind: misconfiguration
    summary: >
      The MCP server forwards the token it received to the Tasks API instead of obtaining one
      of its own. The API now sees a token whose audience is the MCP server, issued to the agent
      host. If the API accepts it, the agent host's token works against an API it was never
      authorized for. The API cannot tell the server's calls from the client's.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Access Token Privilege Restriction" }
    violates: [mcp.rs.no-passthrough, mcp.rs.audience-validation]
    replaces:
      upstream-call:
        - id: forwarded-call
          from: server
          to: api
          message: "GET /tasks with Authorization: Bearer <the client's access token>, unchanged"
          note: >
            The token's audience is still the MCP server. An API that checks aud rejects it. One
            that does not now trusts a token it never issued for itself.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Access Token Privilege Restriction" }
          token:
            name: The client's token, forwarded
            header: { typ: at+jwt, alg: ES256, kid: auth-2026-1 }
            claims:
              iss: https://auth.tasks.example
              sub: alex
              aud: https://mcp.tasks.example/mcp
              client_id: https://agent.example/client.json
              scope: tasks:read tasks:write
              exp: 1790000000
              iat: 1789996400
              jti: 7f2c
  - id: audience-unchecked
    name: Missing audience check
    kind: attack
    summary: >
      The MCP server validates the signature and expiry but not the audience. An attacker who
      obtained a token issued for a different resource behind the same authorization server
      presents it here, and the server accepts a token that was never meant for it.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Token Audience Binding and Validation" }
    violates: [mcp.rs.audience-validation]
    replaces:
      bearer-call:
        - id: replayed-call
          from: client
          to: server
          message: "POST /mcp with Authorization: Bearer <a token issued for https://notes.example>"
          note: >
            The token is genuine and unexpired, signed by the same authorization server, but its
            audience is another resource.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Token Audience Binding and Validation" }
          token:
            name: A token for another resource, replayed
            header: { typ: at+jwt, alg: ES256, kid: auth-2026-1 }
            claims:
              iss: https://auth.tasks.example
              sub: alex
              aud: https://notes.example/mcp
              client_id: https://other-agent.example/client.json
              scope: notes:read
              exp: 1790000000
              iat: 1789996400
              jti: c4d1
      validate:
        - id: validate-without-aud
          from: server
          to: server
          message: "Validate signature, iss and exp only; aud is not compared"
          note: >
            Without the audience check every token the authorization server ever issued for any
            of its resources opens this server.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Token Audience Binding and Validation" }
  - id: issuer-mix-up
    name: Issuer mix-up
    kind: attack
    summary: >
      The authorization response arrives without an iss parameter the client checks, so a
      response crafted by an attacker-controlled authorization server is taken for the real one
      and the client sends the authorization code, and its code verifier, to the attacker's
      token endpoint.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization › Authorization Response Validation" }
    violates: [mcp.as.iss-param, mcp.client.iss-compare-no-normalization]
    replaces:
      authorization-response:
        - id: spoofed-response
          from: as
          to: client
          message: "Redirect with code and state, no iss; the client does not check which server answered"
          note: >
            The client started flows with two authorization servers, one of them the attacker's.
            Without iss it cannot tell whose response this is and pairs the code with the wrong
            one.
          cites: { spec: rfc9207, revision: rfc, section: "2. Response Parameter iss" }
      token-request:
        - id: misrouted-token-request
          from: client
          to: as
          message: "POST /token at the attacker's server with the real code and code_verifier"
          note: >
            The attacker redeems the code at the honest server and holds Alex's access token.
          cites: { spec: rfc9700, revision: rfc, section: "4.4. Mix-Up Attacks" }
  - id: redirect-uri-unchecked
    name: Redirect URI not checked at authorization
    kind: misconfiguration
    summary: >
      The authorization server compares the redirect URI with the client's registered URIs only
      when the code is exchanged, not when the authorization request arrives. A request that
      names a redirect URI the client never registered is still processed, and a server that
      re-approves a client Alex has authorized before sends the code to that URI without
      asking. Whoever controls the URI now holds a code for Alex's grant. This is the pattern
      behind CVE-2025-4143.
    cites: { spec: rfc9700, revision: rfc, section: "4.1. Insufficient Redirect URI Validation" }
    vulnerability: cve-2025-4143
    replaces:
      consent:
        - id: silent-reapproval
          from: as
          to: as
          message: "Client seen before: re-approve without a consent screen; redirect_uri not compared with the registered list"
          note: >
            The baseline step shows Alex the client's name and redirect URI and checks that URI
            against the client's metadata document. Here neither happens: the request carries a
            redirect URI the client never listed, and nobody looks.
          cites: { spec: rfc9700, revision: rfc, section: "4.1. Insufficient Redirect URI Validation" }
      authorization-response:
        - id: code-to-unregistered-uri
          from: as
          to: client
          message: "Redirect with code, state and iss to the redirect URI named in the request, which is not one the client registered"
          note: >
            The browser follows the redirect wherever it points. If the request was started from
            a page an attacker controls, the code lands with the attacker, who can exchange it at
            the token endpoint, where the redirect URI check that does exist is satisfied by
            repeating the same value.
          cites: { spec: rfc9700, revision: rfc, section: "4.1. Insufficient Redirect URI Validation" }
  - id: pkce-skipped
    name: PKCE verifier not checked
    kind: misconfiguration
    summary: >
      The authorization server advertises S256 and records the code challenge, but a token
      request can be shaped so the verifier is never compared with it. An authorization code
      that leaked, through a redirect, a log or a referrer, can then be exchanged by whoever has
      it, without the secret the honest client holds. The check that PKCE exists for is the one
      that is skipped. This is the pattern behind CVE-2025-4144.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Authorization Code Protection" }
    violates: [mcp.as.pkce-s256]
    vulnerability: cve-2025-4144
    replaces:
      token-request:
        - id: token-request-without-verifier
          from: client
          to: as
          message: "POST /token: grant_type=authorization_code, code, resource=https://mcp.tasks.example/mcp; shaped so no verifier is compared"
          note: >
            Sent by whoever holds the code. The honest client's code_verifier is not needed,
            because the server will not ask for it.
          cites: { spec: rfc7636, revision: rfc, section: "4.6. Server Verifies code_verifier before Returning the Tokens" }
      token-response:
        - id: token-without-pkce-check
          from: as
          to: client
          message: "Access token bound to the tasks server, issued without comparing a verifier with the recorded challenge"
          note: >
            The token is as valid as the baseline one. Nothing downstream can tell that the
            code was redeemed by a party that never held the verifier.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Authorization Code Protection" }
          token:
            name: Access token issued without the PKCE check
            header: { typ: at+jwt, alg: ES256, kid: auth-2026-1 }
            claims:
              iss: https://auth.tasks.example
              sub: alex
              aud: https://mcp.tasks.example/mcp
              client_id: https://agent.example/client.json
              scope: tasks:read tasks:write
              exp: 1790000000
              iat: 1789996400
              jti: 7f2c
  - id: endpoint-from-untrusted-metadata
    name: Authorization endpoint taken from untrusted metadata
    kind: attack
    summary: >
      The MCP server Alex's host was pointed at is hostile or hijacked. It names an authorization
      server the attacker controls, whose metadata lists an authorization_endpoint that is not an
      https URL. The client hands that value to the operating system to open, as it would a web
      address, without checking the scheme first. What should have been a browser navigation to a
      consent screen becomes whatever the operating system does with that string. This is the
      pattern behind CVE-2025-6514.
    cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Communication Security" }
    violates: [mcp.as.https]
    vulnerability: cve-2025-6514
    replaces:
      prm:
        - id: hostile-prm
          from: server
          to: client
          message: "resource: https://mcp.tasks.example/mcp, authorization_servers: [an authorization server the attacker controls]"
          note: >
            Everything the client learns about where to authorize comes from this answer. A
            server reached over plain http, or one the person was tricked into adding, can say
            anything here.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Authorization Server Discovery › Authorization Server Location" }
      as-metadata:
        - id: hostile-as-metadata
          from: as
          to: client
          message: "issuer, authorization_endpoint: <not an https URL>, token_endpoint, code_challenge_methods_supported: [S256]"
          note: >
            The specification requires every authorization server endpoint to be https. A client
            that checks this refuses the metadata here and the chain stops.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Communication Security" }
      authorization-request:
        - id: open-unchecked-endpoint
          from: client
          to: user
          message: "Open the authorization_endpoint value on Alex's machine, unchecked, with the request parameters appended"
          note: >
            In the baseline this opens Alex's browser at the authorization server. Here the
            client acts on a value it never validated, on the machine the person is using.
          cites: { spec: mcp-authorization, revision: "2026-07-28", section: "Security Considerations › Communication Security" }
